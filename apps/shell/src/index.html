<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TG Labs — Build. Explore. Share.</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="TG Labs is an engineering lab for frontend architecture, backend systems and developer tools."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Apply visitor preferences before first paint (see PreferencesService).
      try {
        var root = document.documentElement;
        var prefs = JSON.parse(localStorage.getItem('tg-preferences') || '{}');
        var theme = prefs.theme || localStorage.getItem('tg-theme') || 'system';
        if (
          theme === 'dark' ||
          (theme === 'system' &&
            matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          root.classList.add('dark');
        }
        if (typeof prefs.accent === 'string' && prefs.accent !== 'teal') {
          root.dataset.accent = prefs.accent;
        }
        if (prefs.fontScale === 'sm' || prefs.fontScale === 'lg') {
          root.dataset.fontScale = prefs.fontScale;
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <tg-root>
      <noscript>TG Labs requires JavaScript to run.</noscript>
    </tg-root>
  </body>
</html>
