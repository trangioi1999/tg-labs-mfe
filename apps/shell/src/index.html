<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TG Labs — Build. Explore. Share.</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="TG Labs is an engineering lab for frontend architecture, backend systems and developer tools."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Apply the colour theme before first paint (key must match ThemeService).
      try {
        var stored = localStorage.getItem('tg-theme');
        if (stored === 'dark' || (!stored && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <tg-root>
      <noscript>TG Labs requires JavaScript to run.</noscript>
    </tg-root>
  </body>
</html>
