<tg-container width="wide">
  <div class="flex h-16 items-center justify-between gap-6">
    <a
      routerLink="/"
      class="group flex items-center gap-3 rounded-md"
      aria-label="{{ site.name }} home"
    >
      <span
        class="grid size-8 place-items-center rounded-md bg-zinc-900 font-mono text-xs font-bold text-white dark:bg-white dark:text-zinc-900"
        aria-hidden="true"
        >TG</span
      >
      <span class="flex items-baseline gap-2">
        <span
          class="text-base font-semibold tracking-tight text-zinc-950 dark:text-white"
          >{{ site.name }}</span
        >
        <span class="hidden font-mono text-xs text-zinc-500 sm:inline"
          >/ engineering lab</span
        >
      </span>
    </a>

    <nav class="hidden md:block" aria-label="Primary">
      <ul class="flex items-center gap-1">
        @for (item of nav; track item.path) {
        <li>
          <a
            [routerLink]="item.path"
            (mouseenter)="registry.prefetch(item.remote)"
            (focus)="registry.prefetch(item.remote)"
            routerLinkActive="bg-zinc-100 text-zinc-950! dark:bg-zinc-800 dark:text-white!"
            ariaCurrentWhenActive="page"
            class="rounded-md px-3 py-2 text-sm font-medium text-zinc-600 transition-colors hover:text-zinc-950 dark:text-zinc-400 dark:hover:text-white"
            >{{ item.label }}</a
          >
        </li>
        }
      </ul>
    </nav>

    <div class="flex items-center gap-1">
      <button
        type="button"
        class="grid size-9 place-items-center rounded-md text-zinc-600 hover:bg-zinc-100 hover:text-zinc-950 dark:text-zinc-400 dark:hover:bg-zinc-800 dark:hover:text-white"
        [attr.aria-label]="theme.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
        [attr.aria-pressed]="theme.theme() === 'dark'"
        (click)="theme.toggle()"
      >
        @if (theme.theme() === 'dark') {
        <svg
          class="size-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
          />
        </svg>
        } @else {
        <svg
          class="size-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
        </svg>
        }
      </button>
      <a
        [href]="site.repositoryUrl"
        target="_blank"
        rel="noopener noreferrer"
        class="hidden rounded-md px-3 py-2 text-sm font-medium text-zinc-600 hover:text-zinc-950 sm:inline-flex dark:text-zinc-400 dark:hover:text-white"
        >GitHub</a
      >
      <button
        type="button"
        class="grid size-9 place-items-center rounded-md text-zinc-700 hover:bg-zinc-100 md:hidden dark:text-zinc-300 dark:hover:bg-zinc-800"
        aria-controls="mobile-menu"
        [attr.aria-expanded]="navState.mobileMenuOpen()"
        (click)="navState.toggleMobileMenu()"
      >
        <span class="sr-only"
          >{{ navState.mobileMenuOpen() ? 'Close menu' : 'Open menu' }}</span
        >
        <svg
          class="size-5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          @if (navState.mobileMenuOpen()) {
          <path d="M6 6l12 12M18 6 6 18" />
          } @else {
          <path d="M4 7h16M4 12h16M4 17h16" />
          }
        </svg>
      </button>
    </div>
  </div>
</tg-container>

@if (navState.mobileMenuOpen()) {
<nav
  id="mobile-menu"
  class="border-t border-zinc-200 md:hidden dark:border-zinc-800"
  aria-label="Primary mobile"
>
  <tg-container width="wide">
    <ul class="flex flex-col gap-1 py-3">
      @for (item of nav; track item.path) {
      <li>
        <a
          [routerLink]="item.path"
          (touchstart)="registry.prefetch(item.remote)"
          routerLinkActive="bg-zinc-100 dark:bg-zinc-800"
          ariaCurrentWhenActive="page"
          class="block rounded-md px-3 py-2"
        >
          <span class="block text-sm font-medium text-zinc-950 dark:text-white"
            >{{ item.label }}</span
          >
          <span class="block text-xs text-zinc-500"
            >{{ item.description }}</span
          >
        </a>
      </li>
      }
    </ul>
  </tg-container>
</nav>
}

<div
  class="h-0.5 origin-left bg-accent-600 transition-transform duration-300 motion-reduce:transition-none dark:bg-accent-400"
  [class.scale-x-0]="!navState.navigating()"
  [class.scale-x-75]="navState.navigating()"
  aria-hidden="true"
></div>
