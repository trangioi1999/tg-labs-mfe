<tg-container width="wide">
  <div class="flex h-16 items-center justify-between gap-4">
    <a
      routerLink="/"
      class="group flex items-center gap-3 rounded-lg"
      aria-label="{{ site.name }} home"
    >
      <span
        class="relative grid size-9 place-items-center overflow-hidden rounded-lg bg-linear-to-br from-accent-500 to-accent-800 font-mono text-xs font-bold text-white shadow-sm ring-1 shadow-accent-900/20 ring-black/5 transition-transform group-hover:scale-105 motion-reduce:transition-none"
        aria-hidden="true"
      >
        <span
          class="absolute inset-0 bg-[radial-gradient(circle_at_30%_20%,rgb(255_255_255/0.35),transparent_60%)]"
        ></span>
        <span class="relative">TG</span>
      </span>
      <span class="flex flex-col leading-none">
        <span
          class="text-[0.95rem] font-semibold tracking-tight text-zinc-950 dark:text-white"
          >{{ site.name }}</span
        >
        <span
          class="mt-1 hidden font-mono text-[0.68rem] text-zinc-500 sm:block"
          >engineering lab</span
        >
      </span>
    </a>

    <nav class="hidden md:block" aria-label="Primary">
      <ul
        class="flex items-center gap-0.5 rounded-full border border-zinc-200 bg-zinc-50/80 p-1 dark:border-zinc-800 dark:bg-zinc-900/60"
      >
        @for (item of siteNav.sections(); track item.path) {
        <li>
          <a
            [routerLink]="item.path"
            (mouseenter)="siteNav.prefetch(item.remote)"
            (focus)="siteNav.prefetch(item.remote)"
            routerLinkActive="bg-white text-zinc-950! shadow-sm ring-1 ring-zinc-200 dark:bg-zinc-800 dark:text-white! dark:ring-zinc-700"
            ariaCurrentWhenActive="page"
            class="flex items-center gap-2 rounded-full px-3.5 py-1.5 text-sm font-medium text-zinc-600 transition-colors hover:text-zinc-950 dark:text-zinc-400 dark:hover:text-white"
          >
            <tg-icon [name]="iconFor(item.path)" class="size-3.5 opacity-70" />
            {{ item.label }}</a
          >
        </li>
        }
      </ul>
    </nav>

    <div class="flex items-center gap-1">
      <button
        type="button"
        class="grid size-9 place-items-center rounded-lg text-zinc-600 transition-colors hover:bg-zinc-100 hover:text-zinc-950 dark:text-zinc-400 dark:hover:bg-zinc-800 dark:hover:text-white"
        [attr.aria-label]="prefs.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
        [attr.aria-pressed]="prefs.theme() === 'dark'"
        (click)="prefs.toggleTheme()"
      >
        <tg-icon
          [name]="prefs.theme() === 'dark' ? 'sun' : 'moon'"
          class="size-4"
        />
      </button>
      <a
        routerLink="/settings"
        routerLinkActive="bg-zinc-100 text-zinc-950! dark:bg-zinc-800 dark:text-white!"
        ariaCurrentWhenActive="page"
        class="grid size-9 place-items-center rounded-lg text-zinc-600 transition-colors hover:bg-zinc-100 hover:text-zinc-950 dark:text-zinc-400 dark:hover:bg-zinc-800 dark:hover:text-white"
        aria-label="Settings"
        title="Settings"
      >
        <tg-icon name="settings" class="size-4" />
      </a>
      <a
        [href]="site.repositoryUrl"
        target="_blank"
        rel="noopener noreferrer"
        class="hidden size-9 place-items-center rounded-lg text-zinc-600 transition-colors hover:bg-zinc-100 hover:text-zinc-950 sm:grid dark:text-zinc-400 dark:hover:bg-zinc-800 dark:hover:text-white"
        aria-label="GitHub repository"
        title="GitHub"
      >
        <tg-icon name="github" class="size-4" />
      </a>
      <button
        type="button"
        class="grid size-9 place-items-center rounded-lg text-zinc-700 hover:bg-zinc-100 md:hidden dark:text-zinc-300 dark:hover:bg-zinc-800"
        aria-controls="mobile-menu"
        [attr.aria-expanded]="navState.mobileMenuOpen()"
        (click)="navState.toggleMobileMenu()"
      >
        <span class="sr-only"
          >{{ navState.mobileMenuOpen() ? 'Close menu' : 'Open menu' }}</span
        >
        <tg-icon
          [name]="navState.mobileMenuOpen() ? 'close' : 'menu'"
          class="size-5"
        />
      </button>
    </div>
  </div>
</tg-container>

@if (navState.mobileMenuOpen()) {
<nav
  id="mobile-menu"
  class="border-t border-zinc-200 md:hidden dark:border-zinc-800"
  aria-label="Primary mobile"
>
  <tg-container width="wide">
    <ul class="flex flex-col gap-1 py-3">
      @for (item of siteNav.sections(); track item.path) {
      <li>
        <a
          [routerLink]="item.path"
          (touchstart)="siteNav.prefetch(item.remote)"
          routerLinkActive="bg-zinc-100 dark:bg-zinc-800"
          ariaCurrentWhenActive="page"
          class="flex items-start gap-3 rounded-lg px-3 py-2.5"
        >
          <span
            class="grid size-8 place-items-center rounded-md bg-accent-50 text-accent-700 dark:bg-accent-950/60 dark:text-accent-300"
          >
            <tg-icon [name]="iconFor(item.path)" class="size-4" />
          </span>
          <span>
            <span
              class="block text-sm font-medium text-zinc-950 dark:text-white"
              >{{ item.label }}</span
            >
            <span class="block text-xs text-zinc-500"
              >{{ item.description }}</span
            >
          </span>
        </a>
      </li>
      }
      <li class="mt-1 border-t border-zinc-200 pt-2 dark:border-zinc-800">
        <a
          routerLink="/settings"
          class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-zinc-700 dark:text-zinc-300"
        >
          <tg-icon name="settings" class="size-4" /> Settings
        </a>
      </li>
    </ul>
  </tg-container>
</nav>
}

<div
  class="h-0.5 origin-left bg-linear-to-r from-accent-400 to-accent-600 transition-transform duration-300 motion-reduce:transition-none"
  [class.scale-x-0]="!navState.navigating()"
  [class.scale-x-75]="navState.navigating()"
  aria-hidden="true"
></div>
