name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_NO_CLOUD: true
  NX_DAEMON: false

jobs:
  validate:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check formatting
        run: npx nx format:check --all

      # Pull requests: only projects affected by the PR.
      - name: Affected (pull request)
        if: github.event_name == 'pull_request'
        run: npx nx affected -t lint test build --base=${{ github.event.pull_request.base.sha }} --head=HEAD --parallel=3

      # main: only projects affected since the last successful CI run on main.
      - name: Derive SHAs for nx affected
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: nrwl/nx-set-shas@v5
      - name: Affected (main)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npx nx affected -t lint test build --parallel=3

      # Other branches / manual runs: validate everything.
      - name: All projects
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/main'
        run: npx nx run-many -t lint test build --parallel=3

  docker:
    name: Docker image (${{ matrix.app }})
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [shell, blog-mfe, docs-mfe, tools-mfe, playground-mfe, bff]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.app }}.Dockerfile
          push: false
          tags: tg-labs/${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose files
        run: |
          cp .env.example .env
          docker compose --env-file .env -f compose/docker-compose.yml config --quiet
          docker compose --env-file .env -f compose/docker-compose.yml -f compose/docker-compose.dev.yml config --quiet
          docker compose --env-file .env -f compose/docker-compose.yml -f compose/docker-compose.prod.yml config --quiet
