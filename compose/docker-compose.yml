# TG Labs — base Compose definition (frontend + BFF + gateway).
#
# Run from the repository root:
#   docker compose --env-file .env -f compose/docker-compose.yml up --build
#
# Build context for every image is the repository root (..), so Nx config,
# the lockfile and shared libraries are available to each build.
name: tg-labs

x-remote: &remote
  restart: unless-stopped
  environment:
    REMOTE_CORS_ORIGIN: ${REMOTE_CORS_ORIGIN:-*}

services:
  shell:
    build:
      context: ..
      dockerfile: docker/shell.Dockerfile
    image: ${IMAGE_REGISTRY:-tg-labs}/shell:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      ENABLED_REMOTES: ${ENABLED_REMOTES:-all}
      REMOTE_BLOG_URL: ${REMOTE_BLOG_URL:-/mfe/blog/remoteEntry.json}
      REMOTE_DOCS_URL: ${REMOTE_DOCS_URL:-/mfe/docs/remoteEntry.json}
      REMOTE_TOOLS_URL: ${REMOTE_TOOLS_URL:-/mfe/tools/remoteEntry.json}
      REMOTE_PLAYGROUND_URL: ${REMOTE_PLAYGROUND_URL:-/mfe/playground/remoteEntry.json}

  blog-mfe:
    <<: *remote
    build:
      context: ..
      dockerfile: docker/blog-mfe.Dockerfile
    image: ${IMAGE_REGISTRY:-tg-labs}/blog-mfe:${IMAGE_TAG:-local}

  docs-mfe:
    <<: *remote
    build:
      context: ..
      dockerfile: docker/docs-mfe.Dockerfile
    image: ${IMAGE_REGISTRY:-tg-labs}/docs-mfe:${IMAGE_TAG:-local}

  tools-mfe:
    <<: *remote
    build:
      context: ..
      dockerfile: docker/tools-mfe.Dockerfile
    image: ${IMAGE_REGISTRY:-tg-labs}/tools-mfe:${IMAGE_TAG:-local}

  playground-mfe:
    <<: *remote
    build:
      context: ..
      dockerfile: docker/playground-mfe.Dockerfile
    image: ${IMAGE_REGISTRY:-tg-labs}/playground-mfe:${IMAGE_TAG:-local}

  bff:
    build:
      context: ..
      dockerfile: docker/bff.Dockerfile
    image: ${IMAGE_REGISTRY:-tg-labs}/bff:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      PORT: 3000
      APP_VERSION: ${IMAGE_TAG:-local}

  # Single public entry point. Remotes and the BFF are NOT hard dependencies:
  # the gateway resolves upstreams per request, and the Shell renders a
  # fallback page for any remote that is unavailable.
  gateway:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    restart: unless-stopped
    ports:
      - '${GATEWAY_PORT:-8080}:8080'
    volumes:
      - ../infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../infra/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      shell:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '-O',
          '/dev/null',
          'http://127.0.0.1:8080/healthz',
        ]
      interval: 30s
      timeout: 3s
      retries: 3
