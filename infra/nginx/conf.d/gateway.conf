# TG Labs gateway — single public entry point.
#
# Routing responsibilities (most specific first):
#   /mfe/<remote>/...  Remote federation files (remoteEntry.json + chunks)
#                      -> the remote's container, prefix stripped
#   /api/...           Reserved for the BFF
#   /...               Everything else (/, /blog/..., /docs/..., deep links)
#                      -> Shell, which serves index.html for page routes
#
# Page routes such as /blog/my-article are deliberately NOT sent to the Blog
# container: the Shell owns page navigation and loads the Blog remote's code
# from /mfe/blog/.
#
# Upstreams are resolved at request time (variables + Docker DNS) so the
# gateway starts even if a remote is down; the Shell then shows a fallback.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- Remote federation assets --------------------------------------
    location /mfe/blog/ {
        set $upstream http://blog-mfe:8080;
        rewrite ^/mfe/blog/(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    location /mfe/docs/ {
        set $upstream http://docs-mfe:8080;
        rewrite ^/mfe/docs/(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    location /mfe/tools/ {
        set $upstream http://tools-mfe:8080;
        rewrite ^/mfe/tools/(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    location /mfe/playground/ {
        set $upstream http://playground-mfe:8080;
        rewrite ^/mfe/playground/(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    # ---- Backend-for-Frontend ------------------------------------------
    location /api/ {
        set $upstream http://bff:3000;
        proxy_pass $upstream;
    }

    # ---- Shell: home, page routes, global 404 ---------------------------
    location / {
        set $upstream http://shell:8080;
        proxy_pass $upstream;
    }
}
